<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Our services and how we help your business grow.">
    <title>Services – Demo Site</title>

    <link rel="stylesheet" href="/_assets/style.css">
    <script src="/_assets/main.js" defer></script>
    <script src="/_vendor/alpine.min.js" defer></script>

    <script type="module">
        import '/_components/site-header.js';
        import '/_components/site-footer.js';
        import '/_components/hero-section.js';
        import '/_components/features.js';
        import '/_components/feature-card.js';
        import '/_components/cta-section.js';
    </script>
</head>
<body>
    <site-header></site-header>

    <main>
        <!-- Hero section -->
        <hero-section
            title="Our Services"
            subtitle="Practical solutions designed to move your business forward."
            image="services-hero.jpg"
        ></hero-section>

        <!-- Features section -->
        <features-section>
            <feature-card
                title="Strategy & Planning"
                text="Clear roadmaps built around your real business goals."
                icon="🧭"
                image="strategy.png"
            ></feature-card>

            <feature-card
                title="Execution & Delivery"
                text="We turn plans into action and ship real results."
                icon="⚙️"
                image="execution.png"
            ></feature-card>

            <feature-card
                title="Review & Optimization"
                text="Continuous improvement based on measurable outcomes."
                icon="🔍"
                image="review.png"
            ></feature-card>
        </features-section>

        <!-- Call to action -->
        <cta-section
            url="/contact/"
            linktext="Get in touch"
            title="Let’s work together"
            text="Tell us about your project and we’ll take it from there."
        ></cta-section>
    </main>

    <site-footer></site-footer>
</body>
</html>
